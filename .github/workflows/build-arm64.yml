name: Build Sentinel dVPN CLI ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go version
          make build
          file sentinel-dvpncli
          sha256sum sentinel-dvpncli

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v6
        with:
          name: sentinel-dvpncli-linux-arm64
          path: sentinel-dvpncli
